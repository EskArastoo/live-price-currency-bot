name: Post Prices to Telegram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# اجازه خواندن و نوشتن فایل last_prices.json در repository
permissions:
  contents: write

# جلوگیری از اجرای همزمان دو Job
concurrency:
  group: post-prices
  cancel-in-progress: false

jobs:
  post-prices:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # دریافت آخرین نسخه repository
      # ------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # نصب Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # ------------------------------------------------------
      # نصب وابستگی‌ها
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # اجرای ربات
      # ------------------------------------------------------
      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRSAPI_KEY: ${{ secrets.BRSAPI_API_KEY }}
        run: python post_prices.py

      # ------------------------------------------------------
      # ذخیره قیمت‌های فعلی در repository
      # ------------------------------------------------------
      - name: Commit updated price history
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"

          git add last_prices.json

          if git diff --cached --quiet; then
            echo "Price history has no changes."
            exit 0
          fi

          git commit -m "update price history [skip ci]"
          git push
